<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle perspective grid: horizontal lines -->
  <g stroke="#ff8a3d" stroke-width="1" opacity="0.08">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>
  <!-- Vertical lines converging to slight vanishing point -->
  <g stroke="#ff8a3d" stroke-width="1" opacity="0.08">
    <line x1="0"    y1="0" x2="100"  y2="630"/>
    <line x1="300"  y1="0" x2="350"  y2="630"/>
    <line x1="600"  y1="0" x2="600"  y2="630"/>
    <line x1="900"  y1="0" x2="850"  y2="630"/>
    <line x1="1200" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Outer frame (amber at 20%) -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#ff8a3d" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Corner brackets (amber, thicker) -->
  <g stroke="#ff8a3d" stroke-width="3" fill="none">
    <!-- top-left -->
    <polyline points="40,80 40,40 80,40"/>
    <!-- top-right -->
    <polyline points="1120,40 1160,40 1160,80"/>
    <!-- bottom-left -->
    <polyline points="40,550 40,590 80,590"/>
    <!-- bottom-right -->
    <polyline points="1120,590 1160,590 1160,550"/>
  </g>

  <!-- LL monogram chip (top-left) -->
  <g transform="translate(90, 90)">
    <rect x="0" y="0" width="54" height="54" rx="6"
          fill="#ff8a3d" fill-opacity="0.08"
          stroke="#ff8a3d" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="27" y="37" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
          font-weight="900" font-size="22" fill="#ff8a3d"
          letter-spacing="1">LL</text>
  </g>

  <!-- Kicker / category -->
  <text x="170" y="125"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" fill="#ff8a3d" fill-opacity="0.75"
        letter-spacing="6">OPERATOR  DOSSIER</text>

  <!-- Main title -->
  <text x="90" y="320"
        font-family="Orbitron, ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="96" fill="#f5f5f5"
        letter-spacing="4">LEANDRO</text>
  <text x="90" y="420"
        font-family="Orbitron, ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="96" fill="#ff8a3d"
        letter-spacing="4">LUGARESI</text>

  <!-- Subtitle -->
  <text x="90" y="475"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="22" fill="#f5f5f5" fill-opacity="0.7"
        letter-spacing="4">BACKEND  &amp;  SYSTEMS  ENGINEER</text>

  <!-- Bottom row: URL + status -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="16" letter-spacing="4">
    <text x="90" y="555" fill="#ff8a3d" fill-opacity="0.8">
      LEANDROLUGARESI.COM.BR
    </text>
    <text x="1110" y="555" text-anchor="end" fill="#f5f5f5" fill-opacity="0.4">
      ● TRANSMISSION  ONLINE
    </text>
  </g>
</svg>
